events {}
http {
 upstream account_ingestion { server account-ingestion-service:8081; }
 server {
  listen 8080; server_tokens off;
  location = /health { return 200 'OK'; add_header Content-Type text/plain; }
  location /api/v1/accounts {
   proxy_pass http://account_ingestion/api/v1/accounts; proxy_http_version 1.1;
   proxy_set_header Host $host; proxy_set_header X-Correlation-Id $request_id;
   proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_connect_timeout 5s; proxy_read_timeout 30s;
  }
 }
}
