services:
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    depends_on:
      account-ingestion-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  account-ingestion-service:
    build: ./services/account-ingestion-service
    expose: ["8081"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:8081/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  data-validation-service:
    build: ./services/data-validation-service
    expose: ["8082"]
